<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TGFX Web Test</title>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"
            integrity="sha384-+mbV2IY1Zk/X1p/nWllGySJSUN8uMs+gUAN10Or95UBH0fpj6GfKgPmgC5EXieXG"
            crossorigin="anonymous"></script>
</head>
<body>
    <canvas id="tgfx-test-canvas" width="1024" height="1024" style="display: none;"></canvas>
    <script type="module">
        import TGFXTest from './tgfx-test.js';
        import { TGFXBind } from './tgfx.esm.js';

        function collectFiles(fs, dir) {
            const files = [];
            for (const name of fs.readdir(dir)) {
                if (name === '.' || name === '..') continue;
                const fullPath = dir + '/' + name;
                const stat = fs.stat(fullPath);
                if (fs.isDir(stat.mode)) {
                    files.push(...collectFiles(fs, fullPath));
                } else {
                    files.push(fullPath);
                }
            }
            return files;
        }

        async function downloadOutputDir(fs, dir, zipName) {
            try {
                fs.stat(dir);
            } catch (e) {
                console.warn(`No ${dir} directory found, skipping download.`);
                return;
            }
            // Isolate failures per zip so one broken download neither aborts the remaining ones
            // nor escapes to the outer catch where it would be misreported as a test failure.
            try {
                const files = collectFiles(fs, dir);
                if (files.length === 0) {
                    console.warn(`No output files found in ${dir}.`);
                    return;
                }
                console.log(`Packing ${files.length} files from ${dir} into ${zipName}...`);
                const zip = new JSZip();
                const prefix = dir.endsWith('/') ? dir : dir + '/';
                for (const filePath of files) {
                    const data = fs.readFile(filePath);
                    const relativePath = filePath.replace(prefix, '');
                    zip.file(relativePath, data);
                }
                const blob = await zip.generateAsync({type: 'blob'});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = zipName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                console.log(`Download started: ${zipName}`);
            } catch (e) {
                console.warn(`Failed to create ${zipName}:`, e);
            }
        }

        // Initialize WebGPU device if available, needed for WebGPU backend builds.
        const moduleOptions = {};
        if (navigator.gpu) {
            try {
                const adapter = await navigator.gpu.requestAdapter();
                if (adapter) {
                    const device = await adapter.requestDevice();
                    if (device) {
                        moduleOptions.preinitializedWebGPUDevice = device;
                    }
                }
            } catch (e) {
                console.warn('WebGPU initialization failed:', e);
            }
        }

        let exitCodeReported = false;
        try {
        const module = await TGFXTest(moduleOptions);
        TGFXBind(module);
        // Patch missing setColorSpace (tgfx.esm.js is out of date with tgfx.ts source).
        if (!module.tgfx.setColorSpace) {
            module.tgfx.setColorSpace = (GL, colorSpace) => {
                const gl = GL.currentContext?.GLctx;
                if (!gl) return false;
                if ('drawingBufferColorSpace' in gl) {
                    gl.drawingBufferColorSpace = colorSpace <= 1 ? 'srgb' : 'display-p3';
                    return true;
                }
                return colorSpace <= 1;
            };
        }
        // When Asyncify is enabled, ccall returns a Promise; await handles both Asyncify and non-Asyncify cases.
        const result = await module.ccall('RunAllTests', 'number', [], [], {async: true});
        console.log('All tests finished with exit code:', result);
        exitCodeReported = true;
        await downloadOutputDir(module.FS, '/test/baseline-out', 'baseline-out.zip');
        await downloadOutputDir(module.FS, '/test/out', 'test-out.zip');
        // Pack the cache dir rather than baseline-out: an UPDATE_BASELINE run persists the cache it
        // generated, while a verify run only round-trips the preloaded cache unchanged.
        await downloadOutputDir(module.FS, '/test/baseline/.cache', 'cache-web.zip');
        } catch (e) {
            console.error('Test execution failed:', e);
            // Report the failure only if the real exit code was never printed, so a late error
            // cannot flip an already reported pass into a failure.
            if (!exitCodeReported) {
                console.log('All tests finished with exit code: 1');
            }
        } finally {
            // run_test.js waits for this marker; print it on every path, including early returns
            // and failures inside downloadOutputDir.
            console.log('Page actions complete');
        }
    </script>
</body>
</html>
